<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lovable + Apify: a lead finder</title><style>
.iso{

}

  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;

  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;

}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}

@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}

.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}

.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}

.iso{--p-main:#2a2a2c;--p-performers:#246dff;--p-guests:#20a34e;--p-crew:#f86606;--p-gear:#5a6b8c;--p-money:#7c3aed}
.iso[data-theme="dark"],.iso:not([data-theme]){--p-main:#e2e2e2;--p-performers:#8fb4ff;--p-guests:#6fd08f;--p-crew:#ff8a3d;--p-gear:#9fb0cf;--p-money:#c4b5fd}
body.iso[data-theme="light"]{--p-performers:#246dff;--p-guests:#20a34e;--p-crew:#f86606;--p-gear:#5a6b8c;--p-money:#7c3aed}
.ft-lane[data-path="performers"]{fill:var(--p-performers);opacity:.38}
.ft-label[data-path="performers"] .iso-figure:fullscreen{background:var(--anatomy-page);padding:20px 28px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.iso-figure:fullscreen .iso-plate{flex:1;display:flex;flex-direction:column}
.iso-figure:fullscreen .iso-stage{flex:1;display:flex;align-items:center;justify-content:center}
.iso-figure:fullscreen .iso-stage svg{width:auto;height:auto;max-width:100%;max-height:calc(100vh - 260px)}
.iso-figure:fullscreen .iso-legend{display:none}
.ft-tag{stroke:var(--p-performers)}
.ft-lane[data-path="guests"]{fill:var(--p-guests);opacity:.38}
.ft-label[data-path="guests"] .ft-tag{stroke:var(--p-guests)}
.ft-lane[data-path="crew"]{fill:var(--p-crew);opacity:.38}
.ft-label[data-path="crew"] .ft-tag{stroke:var(--p-crew)}
.ft-lane[data-path="gear"]{fill:var(--p-gear);opacity:.38}
.ft-label[data-path="gear"] .ft-tag{stroke:var(--p-gear)}
.ft-lane[data-path="money"]{fill:var(--p-money);opacity:.38}
.ft-label[data-path="money"] .ft-tag{stroke:var(--p-money)}
.ft-node{transition:opacity .25s ease}
svg[data-focus="main"] .ft-node:not(.p-main){opacity:.16}
svg[data-focus="performers"] .ft-node:not(.p-performers){opacity:.16}
svg[data-focus="guests"] .ft-node:not(.p-guests){opacity:.16}
svg[data-focus="crew"] .ft-node:not(.p-crew){opacity:.16}
svg[data-focus="gear"] .ft-node:not(.p-gear){opacity:.16}
svg[data-focus="money"] .ft-node:not(.p-money){opacity:.16}
svg[data-focus="follow"] .ft-node:not(.ft-on){opacity:.2}
.ft-pin rect{fill:var(--anatomy-strong)}
.ft-pin text{fill:var(--anatomy-card);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.ft-pin line{stroke:var(--anatomy-strong);stroke-width:.8}
.ft-ring{fill:none;stroke:var(--anatomy-strong);stroke-width:1.2}
[data-items] > g{cursor:pointer}
.ft-paths{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.ft-paths button{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border:1px solid var(--anatomy-muted);border-radius:999px;background:none;color:var(--anatomy-text);font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer}
.ft-paths button i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.ft-paths button[aria-pressed="true"]{border-color:var(--anatomy-strong);color:var(--anatomy-strong)}
.ft-paths button[data-full]{font-weight:600}
.ft-paths button[data-full][aria-pressed="true"]{background:var(--anatomy-strong);color:var(--anatomy-card);border-color:var(--anatomy-strong)}
.ft-paths button[data-follow]{margin-left:auto;border-color:var(--anatomy-strong);color:var(--anatomy-strong)}
.ft-follow{margin:12px 0 0;padding:10px 12px;border:1px solid var(--anatomy-muted);border-radius:8px}
.ft-follow[hidden]{display:none}

.ft-timeline li{display:grid;grid-template-columns:44px 150px 1fr;gap:8px;opacity:0;animation:ft-in .3s ease forwards}
.ft-timeline li b{font-weight:500;color:var(--anatomy-strong)}
.ft-timeline li span:first-child{color:var(--anatomy-muted)}

@keyframes ft-in{to{opacity:1}}

a-chip="crew" aria-pressed="false"><i style="--c:var(--p-crew)"></i>Lovable app</button><button type="button" data-chip="performers" aria-pressed="false"><i style="--c:var(--p-performers)"></i>The Actor</button><button type="button" data-chip="gear" aria-pressed="false"><i style="--c:var(--p-gear)"></i>Apify infra</button><button type="button" data-chip="guests" aria-pressed="false"><i style="--c:var(--p-guests)"></i>The web</button><button type="button" data-chip="money" aria-pressed="false"><i style="--c:var(--p-money)"></i>Results</button><button type="button" data-hood="" aria-pressed="false">Under the hood</button><span class="ft-pace">Speed <button type="button" data-pace="0.4">0.4×</button><button type="button" data-pace="0.7" aria-pressed="true">0.7×</button><button type="button" data-pace="1">1×</button></span><button type="button" data-story-open="">Story</button><button type="button" data-follow="">Follow a run</button><button type="button" data-fullscreen="">Full screen</button></div><div class="ft-follow" data-follow-panel="" hidden><div class="ft-follow-head"><b data-follow-name=""></b><span data-follow-time=""></span><button type="button" data-follow-stop="">Stop</button></div><ol class="ft-timeline" data-timeline=""></ol></div><div class="xz" data-zoomrow=""><span class="xz-label">Zoom into a station</span><a class="xz-link" href="../anatomy/lovable-apify-anatomy.html" data-zoom="api"><small>05 API call</small>Fig 1 · Lovable + Apify, piece by piece</a></div><p class="ft-says" data-says>Hover a module to see which tool covers it: Lovable, Apify or the web.</p><p class="ft-keys"><span>click a module or its tag to switch it</span><span><kbd>Space</kbd>pause</span><span><kbd>L</kbd>labels</span><span><kbd>V</kbd>full view</span><span><kbd>←</kbd><kbd>→</kbd>story</span><span><kbd>H</kbd>under the hood</span><span><kbd>F</kbd>follow a run</span><span><kbd>Z</kbd>full screen</span></p></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Solid tags 01–13: the main line, from the team's goal to a clean dataset, and the supply row under it</span><span class="iso-key"><svg class="iso-swatch" data-mark="dashed" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Dashed tags P1–P5: the Actor, picked from the Apify Store on the left, running its crawl on the right</span><span class="iso-key"><svg class="iso-swatch" data-mark="dotted" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Dotted tags G1–G3: the live web the Actor reads</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>Belts carry the request, the token, the Actor, the run, pages and the clean JSON</span></span><span class="iso-caption">A lead finder is a few jobs that have to meet in the right order, drawn here as one yard in three zones: build, run and results. On the left Lovable builds the app: the team's goal becomes a prompt, and the build joins it with your APIFY_TOKEN secret and the Google Maps Actor picked from the Apify Store. The app's input fields fill the run input, and its back end function makes the API call. In the middle Apify runs it: the run gets a browser and proxies, the Actor starts, queues pages and parses them, and the scrape reads Google Maps' search results and place pages. On the right every page becomes the same clean JSON in a dataset, with the run log and cost beside it, and the leads land in your app and go out as a call list. Switch a module off and the belt behind it backs up: that is what a missing token, a blocked proxy or a broken Actor looks like.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

    if (m && !m.on) return m.no + " " + m.name + " is off: " + (TROUBLE[id] || "the belt behind it backs up") + ". Click to switch it back on.";
    if (m) return m.no + " " + m.name + ": " + m.says + ". Click to switch it off" + (TROUBLE[id] ? " and see what breaks" : "") + ".";
    const dk = docks.find((d) => d.id === id);
    return dk.name + ": " + dk.says + ".";
  };
  el.addEventListener("pointerenter", () => { hovering = describe; says.textContent = detail(); if (!follow.gid && !follow.waiting) { hoverFocus = (NODE_PATHS[id] || [""]).length === 1 || ["crew"].includes(id) ? (NODE_PATHS[id] || [""])[0] : ""; applyFocus(); } });
  el.addEventListener("pointerleave", () => { hovering = ""; says.textContent = SAYS; hoverFocus = ""; applyFocus(); });
  el.addEventListener("click", () => { toggle(id); hovering = ""; says.textContent = detail(); run(); });
});

stage.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const key = event.key.toLowerCase();
  if (key === "arrowright") { event.preventDefault(); if (!story.on && !stEl.hidden) return; if (stEl.hidden) { showStep(0); return; } showStep(story.i + 1); return; }
  if (key === "arrowleft") { event.preventDefault(); if (stEl.hidden) { showStep(0); return; } showStep(story.i - 1); return; }
  if (key === "h") { event.preventDefault(); toggleHood(); return; }
  if (key === "l") { event.preventDefault(); labelLayer.toggleAttribute("data-hidden"); say(labelLayer.hasAttribute("data-hidden") ? "Labels hidden" : "Labels shown"); return; }
  if (key === " ") { event.preventDefault(); paused = !paused; say(paused ? "Paused" : "Running"); return; }
  if (key === "f") { event.preventDefault(); startFollow(null); run(); return; }
  if (key === "escape") { event.preventDefault(); stopFollow(); pinnedFocus = ""; applyFocus(); return; }
  if (key === "v") { event.preventDefault(); stopFollow(); pinnedFocus = ""; hoverFocus = ""; applyFocus(); return; }
  if (key === "z") { event.preventDefault(); toggleFullscreen(); }
});
chips.forEach((chip) => {
  chip.addEventListener("pointerenter", () => { hoverFocus = chip.dataset.chip; applyFocus(); });
  chip.addEventListener("pointerleave", () => { hoverFocus = ""; applyFocus(); });
  chip.addEventListener("click", () => { if (story.on) exitStory(); if (follow.gid || follow.waiting) stopFollow(); pinnedFocus = pinnedFocus === chip.dataset.chip ? "" : chip.dataset.chip; applyFocus(); });
});
document.querySelector("[data-follow]").addEventListener("click", () => { if (story.on) exitStory(); startFollow(null); run(); });
const hoodBtn = document.querySelector("[data-hood]");
function toggleHood() { hoodPinned = !svg.hasAttribute("data-hood"); svg.toggleAttribute("data-hood", hoodPinned); hoodBtn.setAttribute("aria-pressed", String(hoodPinned)); say(hoodPinned ? "Under the hood: proxies, browser, pages to visit and field rules" : "Plumbing hidden", 3); }
hoodBtn.addEventListener("click", toggleHood);
document.querySelectorAll("[data-pace]").forEach((btn, _, all) => btn.addEventListener("click", () => { PACE = Number(btn.dataset.pace); all.forEach((b) => b.setAttribute("aria-pressed", String(b === btn))); }));
document.querySelector("[data-st-next]").addEventListener("click", () => showStep(story.i + 1));
document.querySelector("[data-st-prev]").addEventListener("click", () => showStep(story.i - 1));
document.querySelector("[data-st-exit]").addEventListener("click", exitStory);
document.querySelector("[data-story-open]").addEventListener("click", () => { stopFollow(); showStep(0); stage.focus({ preventScroll: true }); });
stEl.querySelectorAll("[data-st-dot]").forEach((d) => d.addEventListener("click", () => showStep(Number(d.dataset.stDot))));
document.querySelector("[data-follow-stop]").addEventListener("click", stopFollow);
fullBtn.addEventListener("click", () => { stopFollow(); pinnedFocus = ""; hoverFocus = ""; applyFocus(); });
const figure = stage.closest(".iso-figure");
const fsBtn = document.querySelector("[data-fullscreen]");
const toggleFullscreen = () => { if (document.fullscreenElement) document.exitFullscreen(); else if (figure.requestFullscreen) figure.requestFullscreen(); };
fsBtn.addEventListener("click", toggleFullscreen);
document.addEventListener("fullscreenchange", () => { fsBtn.textContent = document.fullscreenElement ? "Exit full screen" : "Full screen"; });

for (let i = 0; i < 3600; i++) { stepBelts(1 / 60); stepMachines(1 / 60); }
totals.gigs = 0; totals.crew = 0; totals.acts = 0; totals.guests = 0; totals.invoices = 0; settles = []; gigOffset = gigCount; docks.forEach((dk) => { dk.count = 0; dk.flash = 0; });
if (still.matches) paused = true;
showStep(0);
draw(0);
const zoomPeek = (id) => { if (follow.gid || follow.waiting) return; clearMarks(); if (id) { mark(id); const m = byId[id]; if (m) says.textContent = m.no + " " + m.name + ": " + m.says + ". Open its deep dive."; } else says.textContent = SAYS; };
document.querySelectorAll("[data-zoom]").forEach((el) => {
  el.addEventListener("pointerenter", () => zoomPeek(el.dataset.zoom));
  el.addEventListener("pointerleave", () => zoomPeek(""));
  el.addEventListener("focus", () => zoomPeek(el.dataset.zoom));
  el.addEventListener("blur", () => zoomPeek(""));
});
const fromHash = /station=([a-z]+)/.exec(location.hash);
if (fromHash && byId[fromHash[1]]) {
  zoomPeek(fromHash[1]);
  says.textContent = "Back from the deep dive: " + byId[fromHash[1]].no + " " + byId[fromHash[1]].name + " is marked: " + byId[fromHash[1]].says + ".";
  stage.scrollIntoView({ block: "center" });
}
</script></body></html>
